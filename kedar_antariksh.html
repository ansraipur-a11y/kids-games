<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>केदार की अंतरिक्ष यात्रा</title>
<style>
body{margin:0;background:#05061a;color:#eef;font-family:'Noto Sans Devanagari',sans-serif;text-align:center;user-select:none}
h1{margin:6px 0 2px;font-size:22px}#hud{font-size:16px}#msg{min-height:22px;font-size:16px;color:#ffe066}
canvas{border:3px solid #4c3a8a;border-radius:8px;max-width:96vw;touch-action:none;background:#000}
#pad button{font-size:24px;width:70px;height:54px;margin:4px;border-radius:12px;border:0;background:#5f3dc4;color:#fff}
#pad button.f{background:#f08c00;width:110px}
button.r{font-size:17px;padding:8px 16px;border-radius:8px;border:0;background:#2b8a3e;color:#fff;margin:4px}
</style></head><body>
<h1>केदार की अंतरिक्ष यात्रा 🚀 ज्यूपिटर का खज़ाना</h1>
<div id="hud"></div><div id="msg"></div>
<canvas id="c" width="480" height="560"></canvas>
<div id="pad"><button id="L">⬅️</button><button id="F" class="f">⭐ ज़ैप</button><button id="R">➡️</button></div>
<button class="r" onclick="start()">नया खेल</button>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=C.width,H=C.height,GOAL=3000;
const PL=[['🔴','मंगल',.15],['🌕','चंद्रमा',.35],['🟤','बुध',.55],['🔵','नेपच्यून',.75]];
let P,bul,al,ab,rocks,fx,stars,score,lives,dist,state,keys={},last=0,sT=0,rT=0,fT=0,hold={L:0,R:0,F:0},shown;
function start(){P={x:W/2,y:H-60,inv:0};bul=[];al=[];ab=[];rocks=[];fx=[];score=0;lives=5;dist=0;state='play';shown={};
 stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2}));
 msg('केदार, ज्यूपिटर के खज़ाने तक पहुँचो! एलियन कुबेरों को ज़ैप करो! 🚀');}
function msg(s){document.getElementById('msg').textContent=s}
function E(s,x,y,sz){X.font=sz+'px serif';X.textAlign='center';X.textBaseline='middle';X.fillText(s,x,y)}
function T(s,x,y,c,sz){X.fillStyle=c;X.font='bold '+sz+'px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText(s,x,y)}
function loop(t){const dt=Math.min(40,t-last)/16.7;last=t;
 if(state=='play'){
  dist+=dt*1.0;const lv=1+dist/GOAL*3;
  const sp=6*dt;if(keys.ArrowLeft||keys.a||hold.L)P.x-=sp;if(keys.ArrowRight||keys.d||hold.R)P.x+=sp;P.x=Math.max(22,Math.min(W-22,P.x));
  fT-=dt;if((keys[' ']||keys.ArrowUp||hold.F)&&fT<=0){bul.push({x:P.x,y:P.y-26});fT=8}
  if(dist<GOAL-150){sT-=dt;if(sT<=0){al.push({x:30+Math.random()*(W-60),y:-30,b:Math.random()*6,vy:.9+lv*.4,ft:90+Math.random()*120});sT=75-lv*10}
   rT-=dt;if(rT<=0){rocks.push({x:Math.random()*W,y:-30,vy:1.5+lv*.5});rT=150-lv*20}}
  bul.forEach(b=>b.y-=10*dt);bul=bul.filter(b=>b.y>-10);
  al.forEach(a=>{a.y+=a.vy*dt;a.b+=.05*dt;a.x+=Math.sin(a.b)*1.2*dt;a.ft-=dt;if(a.ft<=0&&a.y>0){ab.push({x:a.x,y:a.y+16});a.ft=160+Math.random()*100}});
  ab.forEach(b=>b.y+=3*dt);rocks.forEach(r=>r.y+=r.vy*dt);
  al.forEach(a=>bul.forEach(b=>{if(!b.d&&!a.d&&Math.abs(b.x-a.x)<22&&Math.abs(b.y-a.y)<20){b.d=a.d=1;score+=10;fx.push({x:a.x,y:a.y,t:25,s:'✨'})}}));
  rocks.forEach(r=>bul.forEach(b=>{if(!b.d&&!r.d&&Math.abs(b.x-r.x)<20&&Math.abs(b.y-r.y)<20){b.d=r.d=1;score+=5;fx.push({x:r.x,y:r.y,t:20,s:'💥'})}}));
  const hit=o=>Math.abs(o.x-P.x)<24&&Math.abs(o.y-P.y)<24;
  if(P.inv<=0)[...al,...ab,...rocks].forEach(o=>{if(!o.d&&hit(o)){o.d=1;hurt()}});P.inv-=dt;
  al=al.filter(a=>!a.d&&a.y<H+30);ab=ab.filter(b=>!b.d&&b.y<H+10);rocks=rocks.filter(r=>!r.d&&r.y<H+30);bul=bul.filter(b=>!b.d);
  PL.forEach(p=>{if(!shown[p[1]]&&dist/GOAL>p[2]){shown[p[1]]=1;msg(`वाह! केदार ${p[1]} के पास से गुज़र रहा है! ${p[0]}`)}});
  if(dist>=GOAL){state='win';msg('🎉 केदार ज्यूपिटर पहुँच गया और खज़ाना मिल गया! 💎👑');}
 }
 fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);
 stars.forEach(s=>{s.y+=s.s*dt*(state=='play'?1.5:.3);if(s.y>H){s.y=0;s.x=Math.random()*W}});
 X.fillStyle='#000';X.fillRect(0,0,W,H);X.fillStyle='#fff';stars.forEach(s=>X.fillRect(s.x,s.y,s.s,s.s));
 const fr=dist/GOAL;PL.forEach((p,i)=>{const y=(fr-p[2])*H*5+H/3;if(y>-80&&y<H+80){E(p[0],i%2?W-70:70,y,70);T(p[1],i%2?W-70:70,y+48,'#ccd',13)}});
 const jy=Math.min(150,(fr-.92)*H*12);if(fr>.85){E('🪐',W/2,jy,140);T('ज्यूपिटर',W/2,jy+80,'#ffd8a8',18)}
 ab.forEach(b=>{X.fillStyle='#69db7c';X.beginPath();X.arc(b.x,b.y,5,0,7);X.fill()});rocks.forEach(r=>E('🪨',r.x,r.y,30));
 bul.forEach(b=>E('⭐',b.x,b.y,16));
 al.forEach(a=>{E('👽',a.x,a.y,34);T('कुबेर',a.x,a.y-24,'#8ce99a',11)});fx.forEach(f=>E(f.s,f.x,f.y,24+(25-f.t)));
 if(state!='lose'&&(P.inv<=0||Math.floor(t/100)%2)){E('🚀',P.x,P.y,40);T('केदार',P.x,P.y+30,'#74c0fc',12)}
 X.fillStyle='#333';X.fillRect(10,8,W-20,10);X.fillStyle='#f59f00';X.fillRect(10,8,(W-20)*Math.min(1,fr),10);E('🪐',W-14,13,16);
 document.getElementById('hud').textContent=`अंक: ${score} · जान: ${'❤️'.repeat(Math.max(0,lives))} · ज्यूपिटर तक: ${Math.max(0,100-Math.floor(fr*100))}%`;
 if(state=='win'){E('💎👑💰',W/2,H/2+40,60);T('खज़ाना मिल गया! 🎉',W/2,H/2+110,'#ffe066',26);T(`केदार के अंक: ${score}`,W/2,H/2+145,'#fff',18)}
 if(state=='lose'){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,H/2-60,W,120);T('ओह! यान को आराम चाहिए 🛠️',W/2,H/2-15,'#fff',22);T('"नया खेल" दबाकर फिर उड़ो!',W/2,H/2+22,'#ffe066',17)}
 requestAnimationFrame(loop)}
function hurt(){lives--;P.inv=60;fx.push({x:P.x,y:P.y,t:20,s:'💥'});if(lives<=0){state='lose';msg('केदार का यान थक गया... फिर से कोशिश करो! 🚀')}else msg(`टक्कर लगी! ${lives} जान बची हैं ❤️`)}
addEventListener('keydown',e=>{keys[e.key]=1;if([' ','ArrowLeft','ArrowRight','ArrowUp'].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=0);
['L','R','F'].forEach(id=>{const b=document.getElementById(id),on=e=>{e.preventDefault();hold[id]=1},off=e=>{e.preventDefault();hold[id]=0};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)});
C.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType=='touch'){const r=C.getBoundingClientRect();P.x=(e.clientX-r.left)*W/r.width;hold.F=1}});
C.addEventListener('pointerup',()=>hold.F=0);
start();requestAnimationFrame(loop);
</script></body></html>
